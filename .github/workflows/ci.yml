name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always does real work — meaningful even while the template is empty.
  structure:
    name: Structure and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # doctor.sh runs its YAML check through python3 + pyyaml.
      - name: PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Doctor (links, env parity, secret hygiene, YAML)
        run: ./scripts/doctor.sh --ci

      - name: Docker Compose configuration
        run: docker compose config --quiet && echo "docker-compose.yml OK"

      # The scripts are this repository's product, so they are linted like code.
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/lang/*.sh && echo "shellcheck OK"

  # Detects which stacks exist — the jobs below run accordingly.
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.scan.outputs.node }}
      python: ${{ steps.scan.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        run: |
          node=false; python=false
          for dir in apps/*/ services/*/ packages/*/; do
            [ -d "$dir" ] || continue
            [ -f "$dir/package.json" ]   && node=true
            [ -f "$dir/pyproject.toml" ] && python=true
          done
          echo "node=$node"     >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected — node: $node, python: $python"

  node:
    name: Node (lint / test / build)
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: ./scripts/run.sh --stack node install
      - run: ./scripts/run.sh --stack node lint
      - run: ./scripts/run.sh --stack node test
      - run: ./scripts/run.sh --stack node build

  python:
    name: Python (lint / test)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app_dev_password@localhost:5432/app_db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.2.0
      - run: ./scripts/run.sh --stack python install
      - run: ./scripts/run.sh --stack python lint
      - run: ./scripts/run.sh --stack python test

  # Single place that confirms every required job passed.
  # Make this the required check in branch protection.
  ci-ok:
    name: CI result
    if: always()
    needs: [structure, node, python]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # 'skipped' is fine (that stack is absent); 'failure'/'cancelled' is not.
          if [ "${{ needs.structure.result }}" != "success" ]; then
            echo "the structure job did not pass"; exit 1
          fi
          for r in "${{ needs.node.result }}" "${{ needs.python.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "Job result: $r"; exit 1 ;;
            esac
          done
          echo "All checks passed"
